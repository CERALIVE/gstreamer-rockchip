name: Build Check

# `push` is constrained to `main` on purpose: with a bare `push:` every PR-branch
# push would run this workflow twice, and `concurrency:` does NOT dedupe it —
# refs/heads/<branch> and refs/pull/N/merge hash to different groups.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main, "integration/**"]

concurrency:
  group: build-check-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# A container job's default shell is `sh -e`, and dash has no `pipefail`. Every
# `run:` block here is written as bash; say so once rather than degrading each
# one to POSIX sh.
defaults:
  run:
    shell: bash

jobs:
  # Change detection. A documentation-only pull request has nothing for the
  # build below to prove, so it skips rather than run to a vacuous green.
  #
  # The gating is a JOB-LEVEL `if:`, never a trigger-level `paths:`/
  # `paths-ignore:`. A trigger filter stops the workflow from starting at all,
  # and a required check that never reports blocks a merge instead of passing
  # it — which is what the always-run summary job at the bottom exists to avoid.
  #
  # `code` is an EXCLUSION list — "every changed file is NOT documentation" —
  # so this step carries `predicate-quantifier: 'every'`. The quantifier is a
  # property of the STEP, not of a filter: a positive OR list must live in its
  # own step under the default `some`, or `every` would turn it into an AND that
  # no single file can satisfy.
  changes:
    name: Change detection
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      # The filter runs on pull requests only. On a push the step is skipped and
      # the fallback keeps `code` true, so `main` keeps its full coverage.
      code: ${{ steps.filter.outputs.code || 'true' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Detect non-documentation changes
        id: filter
        if: github.event_name == 'pull_request'
        uses: dorny/paths-filter@v4
        with:
          predicate-quantifier: 'every'
          filters: |
            code:
              - '!**/*.md'
              - '!docs/**'
              - '!LICENSE*'
              - '!.github/ISSUE_TEMPLATE/**'
              - '!.github/PULL_REQUEST_TEMPLATE.md'

  resolve-suite:
    name: Resolve device target suite
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.code == 'true'
    outputs:
      suite: ${{ steps.read.outputs.suite }}
      glibc_floor: ${{ steps.read.outputs.glibc_floor }}
      gst_runtime_minor: ${{ steps.read.outputs.gst_runtime_minor }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      # The values reach the build job as OUTPUTS, never `$GITHUB_ENV`. GitHub
      # selects a job's `container:` before that job's first step runs, so a
      # same-job export is structurally too late to name the image — which is
      # exactly what the build matrix needs it for.
      - name: Read ci/target-suite.env
        id: read
        run: |
          set -euo pipefail
          # shellcheck source=ci/target-suite.env
          source ci/target-suite.env
          for key in TARGET_SUITE GLIBC_FLOOR GST_RUNTIME_MINOR; do
            if [ -z "${!key:-}" ]; then
              echo "ERROR: $key is not declared in ci/target-suite.env" >&2
              exit 1
            fi
          done
          {
            echo "suite=${TARGET_SUITE}"
            echo "glibc_floor=${GLIBC_FLOOR}"
            echo "gst_runtime_minor=${GST_RUNTIME_MINOR}"
          } >> "$GITHUB_OUTPUT"
          echo "target suite ${TARGET_SUITE} · glibc floor ${GLIBC_FLOOR} · GStreamer ${GST_RUNTIME_MINOR}"

      # Without this, flipping TARGET_SUITE to a suite the matrix does not build
      # would silently retire the GLIBC gate: its step condition would match no
      # leg and the workflow would stay green having checked nothing.
      - name: Assert the declared target suite is a matrix leg
        run: |
          set -euo pipefail
          suite='${{ steps.read.outputs.suite }}'
          if ! grep -qE "^ +- suite: ${suite}\$" .github/workflows/build-check.yml; then
            echo "ERROR: ci/target-suite.env declares TARGET_SUITE=${suite}, but the" >&2
            echo "       build matrix has no '- suite: ${suite}' leg, so the GLIBC" >&2
            echo "       floor gate would never run." >&2
            exit 1
          fi
          echo "target suite ${suite} is covered by the build matrix"

  build:
    name: ${{ matrix.suite }} · GStreamer ${{ matrix.gst_minor }} · arm64
    needs: [changes, resolve-suite]
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04-arm
    container:
      image: debian:${{ matrix.suite }}-slim
    continue-on-error: ${{ matrix.experimental }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - suite: bookworm
            gst_minor: "1.22"
            experimental: false
          - suite: trixie
            gst_minor: "1.26"
            experimental: false
    env:
      TARGET_SUITE: ${{ matrix.suite }}
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_MAXSIZE: 200M
    steps:
      # The slim image has no git, and `actions/checkout` silently degrades to a
      # history-less REST tarball without it. Base tooling therefore installs
      # BEFORE the checkout, not after.
      - name: Install base tooling
        run: |
          set -euo pipefail
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates curl git

      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install build dependencies (suite packages + pinned MPP/RGA)
        env:
          RGA_COMPAT_SUITE: ${{ matrix.suite == 'bookworm' && 'bookworm' || '' }}
        run: bash ci/install-build-deps.sh

      - name: Restore ccache
        uses: actions/cache/restore@v6
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache-${{ matrix.suite }}-arm64-${{ github.sha }}
          restore-keys: |
            ccache-${{ matrix.suite }}-arm64-

      - name: Configure bounded ccache
        run: ccache -M "$CCACHE_MAXSIZE"

      # Proves the container really ships the GStreamer this leg claims to test.
      # A declared minor nobody measured is how a "1.26 leg" quietly becomes a
      # second 1.22 leg after a base-image change.
      - name: Assert the container's GStreamer minor
        run: |
          set -euo pipefail
          actual="$(pkg-config --modversion gstreamer-1.0 | cut -d. -f1,2)"
          if [ "$actual" != "${{ matrix.gst_minor }}" ]; then
            echo "ERROR: debian:${{ matrix.suite }}-slim ships GStreamer $actual," >&2
            echo "       but this matrix leg declares ${{ matrix.gst_minor }}." >&2
            exit 1
          fi
          echo "debian:${{ matrix.suite }}-slim ships GStreamer $actual"

      # `CC="ccache gcc"` is the meson way — meson has no compiler-launcher
      # option, it reads the compiler out of the environment at setup time.
      # The feature flags mirror debian/rules so CI builds what the package does.
      - name: meson setup
        run: |
          set -euo pipefail
          export CC="ccache gcc"
          meson setup build \
            -Drkximage=enabled \
            -Drockchipmpp=enabled \
            -Dkmssrc=enabled \
            -Drga=enabled

      - name: meson compile
        run: meson compile -C build

      - name: meson test
        run: meson test -C build --print-errorlogs

      - name: Reject an improcessOpt load-time dependency
        run: |
          set -euo pipefail
          nm -D --undefined-only build/gst/rockchipmpp/libgstrockchipmpp.so > build/mpp-undefined.txt
          nm -D --undefined-only build/gst/rockchiprga/libgstrockchiprga.so > build/rga-undefined.txt
          if grep -w improcessOpt build/mpp-undefined.txt build/rga-undefined.txt; then
            echo 'ERROR: improcessOpt must be resolved dynamically' >&2
            exit 1
          fi

      - name: Standalone test-only MPI interposer gate
        run: |
          set -euo pipefail
          apt-get install -y --no-install-recommends ffmpeg shellcheck
          shellcheck tests/mpi-interposer/check.sh
          CC="ccache gcc" bash tests/mpi-interposer/check.sh build

      - name: Verify the plugin was built
        run: |
          set -euo pipefail
          ls -la build/gst/rockchipmpp/libgstrockchipmpp.so
          file build/gst/rockchipmpp/libgstrockchipmpp.so

      # Run the gate's own fail-red proof in the SAME environment that is about
      # to gate the build — same bash, same objdump, same target-suite.env.
      - name: Prove the GLIBC gate fails red
        run: bash ci/check-glibc-floor.test.sh

      - name: GLIBC floor gate (suite-matched)
        run: bash ci/check-glibc-floor.sh build/gst/rockchipmpp/libgstrockchipmpp.so

      - name: Note the portability leg
        if: matrix.suite != needs.resolve-suite.outputs.suite
        run: |
          echo "${{ matrix.suite }} is a portability leg, not the device"
          echo "target (${{ needs.resolve-suite.outputs.suite }}). It proves the"
          echo "source still builds on GStreamer ${{ matrix.gst_minor }}; the GLIBC"
          echo "floor is checked against this leg's explicit suite contract."

      # Suite-independent: it asks whether the MPP entry points this build calls
      # exist in the exact library the device installs.
      - name: MPP ABI closure gate
        run: bash ci/check-mpp-abi.sh build/gst/rockchipmpp/libgstrockchipmpp.so

      - name: Package and RGA provider contracts
        run: |
          set -euo pipefail
          shellcheck -x ci/install-build-deps.sh ci/rga-suite-pins.test.sh
          shellcheck -x ci/target-suite.test.sh ci/install-smoke.sh packaging/build-deb.sh
          bash ci/target-suite.test.sh
          bash ci/rga-suite-pins.test.sh
          shellcheck -x packaging/package-contract.sh packaging/rga-provider-contract{,.test}.sh
          bash packaging/rga-provider-contract.test.sh
          bash packaging/build-deb.sh
          bash packaging/package-contract.sh stage-deb-arm64 dist

      - name: Retain exact suite-matched board candidate
        uses: actions/upload-artifact@v6
        with:
          name: plugin-${{ matrix.suite }}
          path: dist/*.deb
          if-no-files-found: error

      - name: Save ccache
        if: github.event_name != 'pull_request'
        uses: actions/cache/save@v6
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache-${{ matrix.suite }}-arm64-${{ github.sha }}

      - name: Build Summary
        if: always()
        run: |
          {
            echo "## ${{ matrix.suite }} · GStreamer ${{ matrix.gst_minor }} · arm64"
            echo
            echo "- device target suite: \`${{ needs.resolve-suite.outputs.suite }}\` (GLIBC floor \`${{ needs.resolve-suite.outputs.glibc_floor }}\`)"
            echo "- GLIBC floor gate: enforced against each leg's suite contract"
            echo "- MPP ABI closure: checked against the URL+SHA-pinned \`librockchip-mpp1 1.5.0-1\`"
            echo "- RGA build inputs: R1 1.10.5 headers; ${{ matrix.suite == 'bookworm' && 'legacy Radxa 2.2.0-1 runtime (GStreamer 1.22 portability, not R1 runtime support)' || 'CeraLive R1 1.10.5+ceralive.1 runtime' }}"
          } >> "$GITHUB_STEP_SUMMARY"

  # The one check a branch-protection rule can require. It runs on every event,
  # including a docs-only pull request where every gate above skipped, and goes
  # red whenever a dependency failed or was cancelled. A SKIPPED dependency is a
  # pass — that is the whole point of the gating above.
  build-check-summary:
    name: Build Check summary
    if: always()
    needs:
      - changes
      - resolve-suite
      - build
    runs-on: ubuntu-latest
    steps:
      - name: Fail if any dependency failed or was cancelled
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          set -euo pipefail
          echo "dependency results: ${RESULTS}"
          for result in ${RESULTS}; do
            case "${result}" in
              failure|cancelled)
                echo "::error::a required job reported '${result}'"
                exit 1
                ;;
            esac
          done
          echo "every dependency succeeded or was skipped"
